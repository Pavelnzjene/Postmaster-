<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostMaster AI - Софтуер за Социални Мрежи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; border-radius: 15px; padding: 30px; }
        .app-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 25px; margin-top: -30px; }
        .btn-custom { background-color: #ff6b6b; color: white; font-weight: bold; border: none; padding: 12px 25px; border-radius: 8px; transition: all 0.3s; }
        .btn-custom:hover { background-color: #ee5253; color: white; transform: translateY(-2px); }
        .output-box { background-color: #f8f9fa; border: 2px dashed #dee2e6; border-radius: 10px; padding: 20px; min-height: 200px; position: relative; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="hero-card text-center">
        <h1 class="fw-bold"><i class="fa-solid fa-paper-plane me-2"></i>PostMaster AI</h1>
        <p class="lead mb-0">Автоматизирано съдържание за малкия и средния бизнес</p>
    </div>

    <div class="app-card mx-auto" style="max-width: 800px;">
        <form id="postForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold"><i class="fa-solid fa-globe me-1"></i> Език / Language</label>
                    <select class="form-select" id="language">
                        <option value="bg" selected>🇧🇬 Български</option>
                        <option value="el">🇬🇷 Ελληνικά (Гръцки)</option>
                        <option value="en">🇬🇧 English (Английски)</option>
                    </select>
                </div>
                
                <div class="col-md-6">
                    <label class="form-label fw-bold"><i class="fa-solid fa-briefcase me-1"></i> Бизнес ниша</label>
                    <select class="form-select" id="niche">
                        <option value="auto">🚗 Автосервиз & Детайлинг</option>
                        <option value="welding">🛠️ Заварчици & Строителство</option>
                        <option value="home">🏠 Услуги за дома (ВИК, Климатици)</option>
                        <option value="food">🍽️ Заведение & Ресторант</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold"><i class="fa-solid fa-bullhorn me-1"></i> Цел на публикацията</label>
                    <select class="form-select" id="goal">
                        <option value="promo">💥 Оферта / Промоция</option>
                        <option value="tip">💡 Полезен съвет / Едукация</option>
                        <option value="portfolio">📸 Показване на изработен проект (Преди/След)</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold"><i class="fa-solid fa-pen me-1"></i> Кратко описание (Оферта)</label>
                    <textarea class="form-textarea form-control" id="details" rows="3" placeholder="Напр. Отстъпка 15% за полиране на фарове..."></textarea>
                </div>

                <div class="col-12 text-center mt-4">
                    <button type="button" class="btn btn-custom w-100" onclick="generatePost()">
                        <i class="fa-solid fa-wand-magic-sparkles me-2"></i>Генерирай PostMaster Публикация
                    </button>
                </div>
            </div>
        </form>

        <hr class="my-4">

        <div class="output-section">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-copy me-2"></i>Готова публикация</h5>
            <div class="output-box" id="outputBox">
                <span class="text-muted">Попълнете формата и натиснете бутона...</span>
            </div>
            <button class="btn btn-outline-secondary btn-sm mt-3 w-100" onclick="copyContent()" id="copyBtn" style="display:none;">
                <i class="fa-solid fa-copy me-1"></i> Копирай целия текст
            </button>
        </div>
    </div>
</div>

function generatePost() {
    const lang = document.getElementById('language').value;
    const niche = document.getElementById('niche').value;
    const goal = document.getElementById('goal').value;
    const details = document.getElementById('details').value || "Качествено изпълнение в кратки срокове!";

    let text = "";
    if(templates[lang] && templates[lang][niche] && templates[lang][niche][goal]){
        text = templates[lang][niche][goal].replace("[DETAILS]", details);
    } else {
        text = `🚀 [PostMaster AI]\n\n${details}\n\n📞 Свържете се с нас!`;
    }

    document.getElementById('outputBox').innerText = text;
    document.getElementById('copyBtn').style.display = 'block';
}

function copyContent() {
    const text = document.getElementById('outputBox').innerText;
    navigator.clipboard.writeText(text);
    alert('Текстът е копиран!');
}
</script>

</body>
</html>
