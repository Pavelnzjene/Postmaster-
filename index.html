<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostMaster AI - Професионален Генератор за Бизнес</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-card { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; border-radius: 16px; padding: 30px 20px; }
        .app-card { background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 25px; margin-top: -25px; }
        .btn-magic { background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); color: white; font-weight: bold; border: none; padding: 14px 28px; border-radius: 10px; font-size: 1.1rem; transition: all 0.3s; }
        .btn-magic:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255, 71, 87, 0.4); color: white; }
        .output-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; }
        .post-img { width: 100%; border-radius: 10px; max-height: 400px; object-fit: cover; }
        .idea-box { background-color: #eef2f7; border-left: 4px solid #0d6efd; padding: 12px 15px; border-radius: 6px; font-size: 0.92rem; }
        .loader { display: none; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- Hero Header -->
    <div class="hero-card text-center">
        <h1 class="fw-bold"><i class="fa-solid fa-wand-magic-sparkles me-2"></i>PostMaster AI</h1>
        <p class="mb-0 fs-6 opacity-90">Създай пълен пост (Текст + Идея за заснемане + Уникална AI Снимка) с 1 клик</p>
    </div>

    <!-- Main Card -->
    <div class="app-card mx-auto" style="max-width: 750px;">
        <form id="postForm">
            <div class="row g-3">
                <!-- API Key Input -->
                <div class="col-12">
                    <label class="form-label fw-bold"><i class="fa-solid fa-key me-1 text-warning"></i> Google Gemini API Ключ</label>
                    <input type="password" class="form-control" id="apiKey" placeholder="Въведете вашия Gemini API ключ тук...">
                    <div class="form-text">Нямате ключ? Вземете го безплатно от <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.</div>
                </div>

                <!-- Език -->
                <div class="col-md-6">
                    <label class="form-label fw-bold"><i class="fa-solid fa-language me-1"></i> Език на публикацията</label>
                    <select class="form-select" id="language">
                        <option value="Български" selected>🇧🇬 Български</option>
                        <option value="Гръцки">🇬🇷 Ελληνικά (Гръцки)</option>
                        <option value="Английски">🇬🇧 English (Английски)</option>
                    </select>
                </div>

                <!-- Бизнес Ниша -->
                <div class="col-md-6">
                    <label class="form-label fw-bold"><i class="fa-solid fa-store me-1"></i> Бизнес / Ниша</label>
                    <select class="form-select" id="niche">
                        <optgroup label="🚗 Автомобили & Транспорт">
                            <option value="Автосервиз & Диагностика">🚗 Автосервиз & Диагностика</option>
                            <option value="Автодетайлинг & Полиране">✨ Автодетайлинг & Полиране</option>
                            <option value="Пътна помощ & Вулканизация">🛞 Пътна помощ & Вулканизация</option>
                            <option value="Автомивка">🧼 Автомивка</option>
                        </optgroup>
                        <optgroup label="🛠️ Майстори & Строителство">
                            <option value="Заваръчни услуги & Метални конструкции">🛠️ Заваряване & Метални конструкции</option>
                            <option value="ВИК & Водопроводчик">🚰 ВИК & Водопроводчик</option>
                            <option value="Електротехник & Инсталации">⚡ Електротехник & Инсталации</option>
                            <option value="Климатици & Охлаждане">❄️ Монтаж & Сервиз на Климатици</option>
                            <option value="Ремонт на покриви & Изграждане">🏠 Покриви & Строителство</option>
                            <option value="Вътрешни ремонти & Гипсокартон/Боя">🎨 Вътрешни ремонти & Боядисване</option>
                        </optgroup>
                        <optgroup label="🍽️ Заведения & Услуги">
                            <option value="Ресторант & Таверна">🍽️ Ресторант & Таверна</option>
                            <option value="Кафене & Бар">☕ Кафене & Бар</option>
                            <option value="Салон за красота & Фризьор">✂️ Фризьор & Барбершоп</option>
                            <option value="Козметика & Нокти">💅 Козметика & Маникюр</option>
                        </optgroup>
                        <optgroup label="🏠 Имоти & Домашни услуги">
                            <option value="Недвижими имоти">🏢 Недвижими имоти</option>
                            <option value="Професионално почистване">🧹 Професионално почистване</option>
                            <option value="Мебели по поръчка">🪑 Изработка на Мебели</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Цел -->
                <div class="col-md-12">
                    <label class="form-label fw-bold"><i class="fa-solid fa-bullhorn me-1"></i> Цел на публикацията</label>
                    <select class="form-select" id="goal">
                        <option value="Промоционална оферта с отстъпка">💥 Промоция / Специална оферта</option>
                        <option value="Представяне на завършен проект (Преди / След)">📸 Показване на завършен проект (Преди/След)</option>
                        <option value="Полезен съвет за клиентите">💡 Полезен съвет / Изграждане на доверие</option>
                        <option value="Спешно записване на часове">📅 Свободни часове / Спешна услуга</option>
                    </select>
                </div>

                <!-- Описание -->
                <div class="col-md-12">
                    <label class="form-label fw-bold"><i class="fa-solid fa-pen-to-square me-1"></i> Кратко описание / Ключови детайли</label>
                    <textarea class="form-control" id="details" rows="3" placeholder="Напр. Отстъпка 15% до края на седмицата, Телефон: 99123456, Безплатен оглед..."></textarea>
                </div>

                <!-- Бутон за генериране -->
                <div class="col-12 text-center mt-4">
                    <button type="button" class="btn btn-magic w-100" onclick="generateAllWithAI()">
                        <i class="fa-solid fa-bolt me-2"></i> Генерирай Всичко с 1 Клик (AI)
                    </button>
                </div>
            </div>
        </form>

        <!-- Loader -->
        <div class="loader" id="loader">
            <div class="spinner-border text-primary my-3" role="status"></div>
            <p class="fw-bold text-secondary">AI генерира уникален текст, идея и снимка... Моля, изчакайте!</p>
        </div>

        <hr class="my-4">

        <!-- Резултати -->
        <div id="resultsSection" style="display:none;">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-sparkles text-warning me-2"></i>Готов AI Резултат</h5>
            
            <div class="output-card mb-3">
                <!-- AI Снимка -->
                <div class="mb-3 text-center">
                    <img id="postImage" src="" class="post-img shadow-sm" alt="AI Generated Visual">
                </div>

                <!-- Текст на поста -->
                <div id="outputText" style="white-space: pre-line;" class="mb-3"></div>

                <!-- Идея за заснемане -->
                <div class="idea-box" id="ideaText"></div>
            </div>

            <button class="btn btn-outline-primary btn-sm w-100 fw-bold" onclick="copyContent()">
                <i class="fa-solid fa-copy me-1"></i> Копирай текста на поста
            </button>
        </div>
    </div>
</div>

<script>
async function generateAllWithAI() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const language = document.getElementById('language').value;
    const niche = document.getElementById('niche').value;
    const goal = document.getElementById('goal').value;
    const details = document.getElementById('details').value.trim() || "Професионална услуга и отлично качество.";

    if (!apiKey) {
        alert('Моля, въведете вашия Gemini API ключ!');
        return;
    }

    document.getElementById('loader').style.display = 'block';
    document.getElementById('resultsSection').style.display = 'none';

    try {
        const promptText = `
        Ти си експерт по маркетинг за социални мрежи (Facebook, Instagram, TikTok).
        Създай атрактивна публикация за бизнес.
        Език: ${language}
        Ниша: ${niche}
        Цел: ${goal}
        Допълнителни детайли от собственика: ${details}

        Върни отговора ТОЧНО в следния формат:
        [TEXT]
        (Тук напиши завладяващ текст за социалните мрежи с емотикони, структура, призив за действие/телефон и подходящи хаштагове)
        [/TEXT]

        [IDEA]
        📸 **Съвет за заснемане (Снимка/Видео):** (Напиши кратък, конкретен съвет за собственика каква снимка или видео да заснеме на терен)
        [/IDEA]

        [IMAGE_PROMPT]
        (Напиши кратко описание на английски език за фотореалистична снимка, описваща тази ниша и оферта, например: "A professional welder working on metal frame, sparks flying, highly detailed, 8k photography")
        [/IMAGE_PROMPT]
        `;

        // Обновен адрес за закриване на новия модел gemini-2.0-flash
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

        let response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: promptText }]
                }]
            })
        });

        // Резервен опит с gemini-2.0-flash-exp при случай, че стандартният v1beta се разминава
        if (!response.ok) {
            const fallbackUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`;
            response = await fetch(fallbackUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: promptText }]
                    }]
                })
            });
        }

        const data = await response.json();
        
        if (data.error) {
            throw new Error(data.error.message);
        }

        const aiResponse = data.candidates[0].content.parts[0].text;

        const textMatch = aiResponse.match(/\[TEXT\]([\s\S]*?)\[\/TEXT\]/);
        const ideaMatch = aiResponse.match(/\[IDEA\]([\s\S]*?)\[\/IDEA\]/);
        const imgPromptMatch = aiResponse.match(/\[IMAGE_PROMPT\]([\s\S]*?)\[\/IMAGE_PROMPT\]/);

        const generatedText = textMatch ? textMatch[1].trim() : aiResponse;
        const generatedIdea = ideaMatch ? ideaMatch[1].trim() : "📸 **Съвет:** Заснемете визия от работния процес.";
        const imagePrompt = imgPromptMatch ? imgPromptMatch[1].trim() : `${niche} professional work`;

        // Генериране на снимката през Pollinations AI
        const encodedImagePrompt = encodeURIComponent(imagePrompt);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedImagePrompt}?width=800&height=600&nologo=true&seed=${Math.floor(Math.random() * 1000)}`;

        document.getElementById('outputText').innerText = generatedText;
        document.getElementById('ideaText').innerHTML = generatedIdea;
        document.getElementById('postImage').src = imageUrl;

        document.getElementById('loader').style.display = 'none';
        document.getElementById('resultsSection').style.display = 'block';

    } catch (err) {
        document.getElementById('loader').style.display = 'none';
        alert('Грешка при генерирането: ' + err.message);
    }
}

function copyContent() {
    const text = document.getElementById('outputText').innerText;
    navigator.clipboard.writeText(text);
    alert('Текстът на поста е копиран!');
}
</script>

</body>
</html>
